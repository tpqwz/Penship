name: Android

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - name: Build the Android package
        run: make apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/penship.apk penship-android.apk
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="penship ${tag}"
            prerelease=()
            kind="Release"
          else
            tag="alpha-${GITHUB_SHA}"
            title="penship 0.1.3-alpha (${short})"
            prerelease=(--prerelease)
            kind="Pre-release"
          fi
          notes="${kind} for commit ${GITHUB_SHA}. The attached archive is the Android package only. penship-android.apk holds the arm64-v8a and x86_64 libraries in one APK. It is signed with a debug keystore created in this build, so a device that already has a different penship signature must uninstall the old package before this one will install."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" penship-android.apk --clobber
          else
            gh release create "$tag" penship-android.apk \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              "${prerelease[@]}"
          fi
